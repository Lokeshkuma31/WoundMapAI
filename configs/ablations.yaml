# Controlled Ablations Matrix Configuration
common:
  architecture: "unet"
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  num_classes: 7
  class_names: ["background", "granulation", "slough", "necrotic", "maceration", "bone", "tendon"]
  target_height: 512
  target_width: 512
  epochs: 50
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.0001
  seed: 42
  split_source: "data/manifests/manifest.csv"
  loss: "dice_ce_composite"

clahe_parameters:
  clip_limit: 2.0
  tile_grid_size: [8, 8]

conditions:
  - id: "RUN-01"
    name: "baseline_srgb_raw"
    description: "Standard sRGB input without illumination normalization"
    color_space: "RGB"
    illumination_norm: "none"
    clahe_channel: null

  - id: "RUN-02"
    name: "hsv_raw"
    description: "HSV representation without illumination normalization"
    color_space: "HSV"
    illumination_norm: "none"
    clahe_channel: null

  - id: "RUN-03"
    name: "cielab_raw"
    description: "CIE L*a*b* representation without illumination normalization"
    color_space: "CIELAB"
    illumination_norm: "none"
    clahe_channel: null

  - id: "RUN-04"
    name: "srgb_clahe"
    description: "sRGB representation with CLAHE applied to all channels"
    color_space: "RGB"
    illumination_norm: "clahe"
    clahe_channel: "all"

  - id: "RUN-05"
    name: "hsv_clahe_v"
    description: "HSV representation with CLAHE applied strictly to V (Value/Luminance) channel"
    color_space: "HSV"
    illumination_norm: "clahe"
    clahe_channel: "V"

  - id: "RUN-06"
    name: "cielab_clahe_l"
    description: "CIE L*a*b* representation with CLAHE applied strictly to L* (Luminance) channel"
    color_space: "CIELAB"
    illumination_norm: "clahe"
    clahe_channel: "L"
