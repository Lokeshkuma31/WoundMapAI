# Baseline Segmentation Model Configuration
experiment:
  name: "baseline_unet_rgb"
  color_space: "RGB"
  illumination_norm: "none"
  seed: 42

dataset:
  num_classes: 7
  class_names: ["background", "granulation", "slough", "necrotic", "maceration", "bone", "tendon"]
  target_height: 512
  target_width: 512
  manifests:
    train: "data/manifests/train.csv"
    val: "data/manifests/val.csv"
    test: "data/manifests/test.csv"

model:
  architecture: "unet"
  encoder_name: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 3
  num_classes: 7

training:
  batch_size: 8
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.0001
  loss: "dice_ce_composite"
  loss_weights:
    dice: 0.5
    ce: 0.5
  early_stopping:
    patience: 10
    metric: "val_macro_dice"
    mode: "max"

checkpoints:
  save_dir: "outputs/checkpoints/baseline"
  best_checkpoint: "best_baseline_unet_rgb.pt"
